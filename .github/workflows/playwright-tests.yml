name: 🤖 Tests E2E (Playwright + Émulateurs Firebase)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 🧪 E2E sur émulateurs (cart / commande / stock)
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🟢 Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Les émulateurs Firebase (Firestore/Auth/Storage) sont des apps Java :
      # firebase-tools exige un JDK >= 21.
      - name: ☕ Java 21 (émulateurs Firebase)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 📦 Dépendances (racine)
        run: npm ci

      # firebase-admin (utilisé par le seed) vit dans functions/node_modules.
      - name: 📦 Dépendances (functions, pour le seed)
        run: npm ci --prefix functions

      - name: 🔧 Firebase CLI
        run: npm install -g firebase-tools

      - name: 🌐 Navigateurs Playwright
        run: npx playwright install --with-deps chromium

      # Démarre auth/firestore/storage en émulateur, seed, puis lance les 3 specs
      # qui ne dépendent PAS du paiement Stripe (cf. package.json → test:e2e).
      # L'app se branche sur les émulateurs grâce à VITE_E2E_TESTING=true.
      - name: 🧪 Tests E2E
        run: npm run test:e2e

      - name: 📁 Rapport Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

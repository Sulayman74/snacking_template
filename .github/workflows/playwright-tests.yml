name: 🤖 Tests E2E (Playwright + Émulateurs Firebase)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  theming-guard:
    name: 🎛️ Garde-fou theming (anti-régression tokens)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4
      - name: 🟢 Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      # Le script n'utilise que des modules Node natifs : pas de npm ci nécessaire.
      - name: 🎨 Vérification des couleurs en dur (surface client)
        run: npm run lint:theming

  test:
    name: 🧪 E2E sur émulateurs (cart / commande / stock)
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupération du code
        uses: actions/checkout@v4

      - name: 🟢 Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Les émulateurs Firebase (Firestore/Auth/Storage) sont des apps Java :
      # firebase-tools exige un JDK >= 21.
      - name: ☕ Java 21 (émulateurs Firebase)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 📦 Dépendances (racine)
        run: npm ci

      # firebase-admin (utilisé par le seed) vit dans functions/node_modules.
      - name: 📦 Dépendances (functions, pour le seed)
        run: npm ci --prefix functions

      - name: 🔧 Firebase CLI
        run: npm install -g firebase-tools

      - name: 🌐 Navigateurs Playwright
        run: npx playwright install --with-deps chromium

      # Démarre les émulateurs, seed, puis lance les specs E2E (cf. package.json →
      # test:e2e), dont guest-checkout qui appelle l'API Stripe TEST.
      # L'app se branche sur les émulateurs grâce à VITE_E2E_TESTING=true.
      - name: 🧪 Tests E2E
        # Clé Stripe TEST fournie UNIQUEMENT par le secret GitHub (aucune clé en dur).
        # Les Functions la lisent comme un secret → functions/.secret.local en émulateur.
        run: |
          if [ -z "$STRIPE_SECRET_KEY" ]; then
            echo "::error::Secret GitHub STRIPE_SECRET_KEY manquant (clé sk_test_ du sandbox Stripe)."
            exit 1
          fi
          case "$STRIPE_SECRET_KEY" in
            sk_test_*) ;;
            *) echo "::error::STRIPE_SECRET_KEY doit être une clé TEST (sk_test_)."; exit 1 ;;
          esac
          umask 077
          echo "STRIPE_SECRET_KEY=$STRIPE_SECRET_KEY" > functions/.secret.local
          npm run test:e2e
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      # 🔒 Règles Firestore (isolation multi-tenant, transitions livreur, tokens push).
      - name: 🔒 Tests des règles Firestore
        run: npm run test:rules

      # 🛠️ Service worker sur le build de prod (push, kill-switch). Le build exige
      # la clé publishable (garde-fou vite.config.js) ; aucun appel externe pendant les tests.
      - name: 🛠️ Tests PWA (service worker)
        run: npm run test:pwa
        env:
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}

      - name: 📁 Rapport Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

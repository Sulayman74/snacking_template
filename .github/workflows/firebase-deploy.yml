name: 🚀 CI/CD — Deploy Firebase Hosting (multi-clients)

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 🧪 Tests unitaires (rapides + déterministes). INFORMATIF pour l'instant :
  #    tourne à chaque push et reporte ✅/❌, mais NE bloque PAS le déploiement
  #    (pas de `needs`). À passer bloquant quand la couverture sera significative.
  # ─────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: 🧪 Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 📦 Install dependencies
        run: npm ci
      - name: 🧪 Vitest
        run: npm run test:unit

  deploy:
    name: 🚀 Deploy ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false   # si tacos plante, pizza continue quand même
      matrix:
        include:
          - target: snacking-template
            snack_id: Ym1YiO4Ue5Fb5UXlxr06
          - target: o-bois-pizza
            snack_id: PsobiuoeUzNmHnwGtaRu
          - target: pizzeriadelagare
            snack_id: 4L9THuI6hIAqKjjZUn4s
          - target: belly-smash-burger
            snack_id: umaGD0nOIWwgpyy8Ta4h
          # ── Ajouter un client ici quand son site Firebase Hosting est créé ──
          # - target: demo-client3
          #   snack_id: REMPLACER_SNACK_ID_CLIENT3

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      # Build avec SNACK_ID → dist/<snack_id>/ (utilisé tel quel par firebase.json)
      # VITE_STRIPE_PUBLISHABLE_KEY injectée au build (F7) : sans elle, le bundle
      # retombe sur la clé de TEST. Clé publishable = publique, unique pour tous les
      # tenants (Connect route par compte côté serveur). Si créée en Variable plutôt
      # qu'en Secret, remplacer `secrets.` par `vars.`.
      - name: 🏗️ Build — ${{ matrix.snack_id }}
        env:
          SNACK_ID: ${{ matrix.snack_id }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          # Clé du SITE reCAPTCHA v3 (publique) → App Check attache un token aux
          # appels Firestore/Functions. Ne bloque RIEN tant que l'enforcement n'est
          # pas activé côté Firebase Console (cf. APP_CHECK_SETUP.md).
          VITE_APPCHECK_SITE_KEY: ${{ secrets.VITE_APPCHECK_SITE_KEY }}
        run: npm run build

      # Auth via le service account stocké dans les secrets GitHub
      - name: 🔑 Google auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SNACKING_TEMPLATE }}

      # Déploie uniquement le site correspondant au target de la matrice
      - name: 🚀 Firebase deploy — ${{ matrix.target }}
        run: npx firebase-tools@latest deploy --only hosting:${{ matrix.target }} --project snacking-template --non-interactive

  # ─────────────────────────────────────────────────────────────────────────
  # 🔒 Backend GLOBAL (un seul projet Firebase pour tous les tenants) :
  #    règles Firestore + Storage. Déployées UNE fois, pas par client.
  #    Sans ce job, toute correction de sécurité reste dans le repo sans
  #    jamais atteindre la prod (dérive repo↔prod). Pas de build nécessaire.
  # ─────────────────────────────────────────────────────────────────────────
  deploy-rules:
    name: 🔒 Deploy Firestore & Storage rules
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
         uses: actions/checkout@v4

      - name: 🔑 Google auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SNACKING_TEMPLATE }}

      # Étapes séparées : les rules Firestore (les plus critiques) sont déployées
      # d'abord et indépendamment — un éventuel échec IAM sur Storage ne les bloque pas.
      - name: 🔒 Firebase deploy — Firestore rules
        run: npx firebase-tools@latest deploy --only firestore:rules --project snacking-template --non-interactive

      - name: 🔒 Firebase deploy — Storage rules
        run: npx firebase-tools@latest deploy --only storage --project snacking-template --non-interactive
